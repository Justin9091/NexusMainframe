name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-tidy clang-format libssl-dev ninja-build
      - name: Check formatting
        continue-on-error: true
        run: |
          find src includes -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) \
            -exec clang-format --dry-run --Werror {} + || true
      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy
        continue-on-error: true
        run: |
          find src -name '*.cpp' -exec clang-tidy -p build \
            --checks='-*,bugprone-*,clang-analyzer-*' {} + || true

  build:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++
            coverage: true
            compiler_launcher: ""   # ccache conflicts with gcov .gcda generation
          - os: ubuntu-latest
            compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
            compiler_launcher: ccache
          - os: windows-latest
            compiler: msvc
            c_compiler: cl
            cpp_compiler: cl
            coverage: false
            compiler_launcher: sccache
          - os: macos-latest
            compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
            coverage: false
            compiler_launcher: ccache
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake lcov ninja-build libssl-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install ninja openssl

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup ccache
        if: matrix.compiler_launcher != ''
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps_cache
          key: deps-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', '**/CMakeLists.txt') }}
          restore-keys: deps-${{ matrix.os }}-

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.coverage && 'Debug' || 'Release' }}
          -DNEXUS_BUILD_TESTS=ON
          -DNEXUS_ENABLE_COV=${{ matrix.coverage && 'ON' || 'OFF' }}
          -DNEXUS_FAST_BUILD=${{ matrix.coverage && 'OFF' || 'ON' }}
          ${{ matrix.compiler_launcher != '' && format('-DCMAKE_CXX_COMPILER_LAUNCHER={0} -DCMAKE_C_COMPILER_LAUNCHER={0}', matrix.compiler_launcher) || '' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.coverage && 'Debug' || 'Release' }} --parallel

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -C ${{ matrix.coverage && 'Debug' || 'Release' }} --parallel 4

      - name: Generate coverage
        if: matrix.coverage
        working-directory: build
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload to Coveralls
        if: matrix.coverage && hashFiles('build/coverage.info') != ''
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: build/coverage.info
          format: lcov

      - name: Upload coverage artifact
        if: matrix.coverage && hashFiles('build/coverage.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.info
          retention-days: 7

      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: |
            build/bin/
            build/lib/
          retention-days: 30

  build-summary:
    name: Build Summary
    needs: [lint, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more builds failed"
            exit 1
          fi
          echo "✅ All builds passed successfully"
